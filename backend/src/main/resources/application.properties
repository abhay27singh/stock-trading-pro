spring.application.name=market-data-service
server.port=${SERVER_PORT:8081}

# Own database (DB-per-service) — Market-Data owns stocks + price history
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/market_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT — this service only VALIDATES tokens (HS256) signed by the Auth service (shared secret)
jwt.secret=${JWT_SECRET}

# Prediction + Market Data (Python/Flask) service
prediction.service.url=${PREDICTION_SERVICE_URL:http://localhost:5001}

# How often (ms) to pull live quotes from the market-data service
market.poll.rate=${MARKET_POLL_RATE:10000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002}

# Logging — include the request correlation id [requestId] on every line
logging.level.org.springframework.security=INFO
logging.pattern.level=%5p [%X{requestId:-}]
