spring.application.name=trading-service
server.port=${SERVER_PORT:8084}

# Own database (DB-per-service) — Trading owns portfolio, transactions, watchlist
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trading_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Validate JWTs (HS256) signed by the Auth service (shared secret)
jwt.secret=${JWT_SECRET}

# Downstream services
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8082}
market.data.url=${MARKET_DATA_URL:http://localhost:8081}
internal.api.key=${INTERNAL_API_KEY}

logging.level.org.springframework.security=INFO
logging.pattern.level=%5p [%X{requestId:-}] [%X{user:-anon}]

# Gzip responses. The JSON this serves (stock lists, OHLCV candles, option chains) is
# highly repetitive, so compression cuts transfer size sharply for a little CPU.
# min-response-size avoids spending that CPU on tiny bodies where it would not pay off.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
