spring.application.name=auth-user-service
server.port=${SERVER_PORT:8082}

# Own database (DB-per-service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Shared HMAC secret — Core service trusts tokens signed with this same key
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Shared secret for service-to-service (internal wallet) calls from the Core service
internal.api.key=${INTERNAL_API_KEY}

logging.level.org.springframework.security=INFO
logging.pattern.level=%5p [%X{requestId:-}] [%X{user:-anon}]

# Gzip responses. The JSON this serves (stock lists, OHLCV candles, option chains) is
# highly repetitive, so compression cuts transfer size sharply for a little CPU.
# min-response-size avoids spending that CPU on tiny bodies where it would not pay off.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
